# Social (Instagram) content calendar - source of truth for the admin
# dashboard's Social view. status: draft | delivered | posted | skipped
#  - draft     = concept only, not yet produced
#  - delivered = FINISHED asset(s) produced + sent to Telegram, awaiting post
#  - posted    = live on Instagram (verified on the @clini.click grid)
#
# MODEL (Abdullah 2026-05-18, confirmed against the live grid screenshot):
#  - Each post = ONE concept. The grid stays the catchy, vibrant
#    object-pun tile set we built; every tile (single OR carousel cover)
#    is the approved object-pun + title. Do not lose it.
#  - FORMAT MIX for organic growth (NOT all carousels):
#      SINGLE  = the witty object-pun tile only. Fast, grows the vibrant
#                grid, low lift. Use for punchy concept tiles.
#      CAROUSEL = same object-pun cover + fun vibrant info slides. Use
#                for save-worthy meatier topics (what-helps, decoders,
#                myth-busts). ~2 carousels + ~3 singles per week.
#  - NO TOPIC REPEATS (Abdullah 2026-05-21): every post is a DISTINCT
#    topic. Never re-run a concern/treatment already posted - not even
#    as a "different angle/format" (that is what got dark spots posted
#    twice). Grow the pool with new evergreen, seasonal and decoder
#    topics instead. See feedback memory feedback_no_social_repeats.
#  - NO PRICING CONTENT until booking launches (Abdullah 2026-05-21):
#    pricing is a booking-era topic. Keep it off the calendar entirely
#    for now - revisit only when booking goes live.
#  - Finished assets only, never briefs. NO booking language. Educational,
#    relaxed/witty captions, no "plain-English", criteria mode, not
#    medical advice, no clinic names, no attacking ads. Reels deferred.
#  - Render: carousel = social-carousel.ts (spec social-briefs/<slug>.json);
#    single = social-post.ts --source=<approved object-pun> (+ <slug>.json
#    for caption + 5 hashtags). ~5 posts/week + Stories daily; Sun off.
